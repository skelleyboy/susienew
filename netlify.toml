[build]
  command = "npm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"

# Serve the same page content as Markdown only when explicitly requested.
[[edge_functions]]
  path = "/*"
  function = "markdown"

# Force HTTPS
[[redirects]]
  from = "http://susiesharak.com/*"
  to = "https://susiesharak.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.susiesharak.com/*"
  to = "https://susiesharak.com/:splat"
  status = 301
  force = true

# Strip www
[[redirects]]
  from = "https://www.susiesharak.com/*"
  to = "https://susiesharak.com/:splat"
  status = 301
  force = true

# Redirect old blog format with trailing slash
[[redirects]]
  from = "/blog/*/"
  to = "/blog/:splat"
  status = 301
  force = true

# Strip trailing slashes globally
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = true

# Individual static HTML routes and real 404 responses are generated in
# dist/public/_redirects. Do not restore a catch-all homepage rewrite.

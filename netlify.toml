[build]
  command = "npm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"

# Serve the same page content as Markdown only when explicitly requested.
[[edge_functions]]
  path = "/*"
  function = "markdown"

# Canonical host/HTTPS, legacy URLs, slash redirects, per-page rewrites and the
# final real 404 rule are generated together in dist/public/_redirects.
# Netlify reads that file before this one, so splitting rules between the two
# can let page rewrites or the 404 catch-all shadow canonical redirects.
# Do not restore a catch-all homepage rewrite.

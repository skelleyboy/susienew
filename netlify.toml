[build]
  command = "npm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"

# Serve the same page content as Markdown only when explicitly requested.
[[edge_functions]]
  path = "/*"
  function = "markdown"

# Only www-to-apex and the two approved legacy redirects are generated in
# dist/public/_redirects, followed by internal page rewrites and the real 404.
# Netlify handles HTTPS. Do not add protocol or forwarded-header redirects.
# Do not restore a catch-all homepage rewrite.
